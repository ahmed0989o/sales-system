<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سجل المبيعات</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 15px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      background: white;
      padding: 18px;
      border-radius: 12px;
    }

    h1 {
      text-align: center;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .actions a,
    button {
      display: inline-block;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      text-decoration: none;
      cursor: pointer;
      font-size: 15px;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .summary {
      background: #f1f1f1;
      border-radius: 8px;
      padding: 15px;
      margin: 12px 0;
      font-weight: bold;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }

    th {
      background: #222;
      color: white;
    }

    tr:nth-child(even) {
      background: #f8f8f8;
    }

    .details {
      text-align: right;
      white-space: normal;
      min-width: 180px;
    }

    #status {
      text-align: center;
      margin: 15px 0;
      font-weight: bold;
    }
  </style>
</head>

<body>
<div class="container">

  <h1>📋 سجل المبيعات</h1>

  <div class="actions">
    <a href="index.html">➕ صفحة البيع</a>
    <button onclick="loadSales()">🔄 تحديث السجل</button>
  </div>

  <input
    id="search"
    type="search"
    placeholder="ابحث برقم الفاتورة أو اسم الزبون"
    oninput="renderSales()"
  >

  <div class="summary">
    عدد الفواتير: <span id="count">0</span>
    <br><br>
    مجموع الفواتير المعروضة:
    <span id="sum">0</span>
  </div>

  <div id="status">جارٍ تحميل سجل المبيعات...</div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>رقم الفاتورة</th>
          <th>الزبون</th>
          <th>الإجمالي</th>
          <th>الدفع</th>
          <th>التاريخ</th>
          <th>التفاصيل</th>
        </tr>
      </thead>
      <tbody id="salesBody"></tbody>
    </table>
  </div>

</div>

<script>
const SUPABASE_URL =
  "https://crihxojzewxhjpsckoew.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_irCTojKFVHjkc65Y1d95zQ_xVRwQXcQ";

let sales = [];
let details = [];
let productNames = {};

async function apiGet(path) {
  const response = await fetch(
    `${SUPABASE_URL}/rest/v1/${path}`,
    {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`
      }
    }
  );

  if (!response.ok) {
    throw new Error(await response.text());
  }

  return response.json();
}

async function loadSales() {
  const status = document.getElementById("status");
  status.textContent = "جارٍ تحميل سجل المبيعات...";

  try {
    const results = await Promise.all([
      apiGet("sales?select=*&order=created_at.desc"),
      apiGet("sale_details?select=*"),
      apiGet("products?select=id,name")
    ]);

    sales = results[0];
    details = results[1];
    productNames = {};

    results[2].forEach(product => {
      productNames[String(product.id)] = product.name;
    });

    renderSales();

    status.textContent = sales.length
      ? "تم تحميل سجل المبيعات بنجاح"
      : "لا توجد فواتير مسجلة حتى الآن";

  } catch (error) {
    console.error(error);
    status.textContent =
      "تعذر تحميل السجل: " + error.message;
  }
}

function renderSales() {
  const search = document
    .getElementById("search").value
    .trim().toLowerCase();

  const filtered = sales.filter(sale =>
    String(sale.invoice_number || "").toLowerCase().includes(search) ||
    String(sale.customer_name || "").toLowerCase().includes(search)
  );

  const tbody = document.getElementById("salesBody");
  tbody.innerHTML = "";

  let total = 0;

  filtered.forEach(sale => {
    const amount = Number(sale.total_amount || 0);
    total += amount;

    const dateValue =
      sale.created_at || sale.createdAt || sale.sale_date;

    const dateText = dateValue
      ? new Date(dateValue).toLocaleString("ar-IQ")
      : "غير متوفر";

    const saleDetails = details.filter(
      item => String(item.sale_id) === String(sale.id)
    );

    const detailsText = saleDetails.map(item => {
      const name =
        productNames[String(item.product_id)] ||
        "منتج رقم " + item.product_id;

      return `${name} — الكمية: ${item.quantity} — سعر الوحدة: ${item.unit_price} — الإجمالي: ${item.total}`;
    }).join("\n");

    const tr = document.createElement("tr");

    const values = [
      sale.invoice_number || "—",
      sale.customer_name || "—",
      amount.toLocaleString("en-US"),
      sale.payment_method || "—",
      dateText
    ];

    values.forEach(value => {
      const td = document.createElement("td");
      td.textContent = value;
      tr.appendChild(td);
    });

    const detailsCell = document.createElement("td");
    detailsCell.className = "details";
    detailsCell.textContent = detailsText || "لا توجد تفاصيل";
    tr.appendChild(detailsCell);

    tbody.appendChild(tr);
  });

  document.getElementById("count").textContent = filtered.length;
  document.getElementById("sum").textContent =
    total.toLocaleString("en-US");
}

loadSales();
</script>

</body>
</html>
