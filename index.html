<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام المبيعات</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
    }

    h1 {
      text-align: center;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      margin-top: 20px;
      background: #222;
      color: white;
      border: none;
    }

    .total {
      margin-top: 20px;
      padding: 15px;
      background: #f1f1f1;
      border-radius: 8px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    #status {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🧾 فاتورة بيع</h1>

  <label>رقم الفاتورة</label>
  <input type="text" id="invoiceNumber">

  <label>اسم الزبون</label>
  <input type="text" id="customerName">

  <label>المنتج</label>
  <select id="product">
    <option value="">جاري تحميل المنتجات...</option>
  </select>

  <label>الكمية</label>
  <input type="number" id="quantity" value="1" min="1">

  <label>سعر الوحدة</label>
  <input type="number" id="unitPrice" readonly>

  <div class="total">
    الإجمالي: <span id="total">0</span>
  </div>

  <label>طريقة الدفع</label>
  <select id="paymentMethod">
    <option value="نقدي">نقدي</option>
    <option value="آجل">آجل</option>
  </select>

  <button onclick="saveSale()">حفظ البيع</button>

  <div id="status"></div>

</div>

<script>
  const SUPABASE_URL =
    "https://crihxojzewxhjpsckoew.supabase.co";

  const SUPABASE_KEY =
"sb_publishable_irCTojKFVHjkc65Y1d95zQ_xVRwQXcQ";

  let products = [];

  async function loadProducts() {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/products?select=id,name,price,quantity&order=name.asc`,
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (!response.ok) {
      throw new Error("فشل تحميل المنتجات");
    }

    products = await response.json();

    const select = document.getElementById("product");

    select.innerHTML =
      '<option value="">اختر المنتج</option>';

    products.forEach(product => {

      const option = document.createElement("option");

      option.value = product.id;

      option.textContent =
        `${product.name} - ${product.price}`;

      select.appendChild(option);
    });
  }

  document.getElementById("product")
    .addEventListener("change", function () {

      const product = products.find(
        p => String(p.id) === String(this.value)
      );

      if (product) {
        document.getElementById("unitPrice").value =
          product.price;

        calculateTotal();
      }
    });

  document.getElementById("quantity")
    .addEventListener("input", calculateTotal);

  function calculateTotal() {

    const quantity =
      Number(document.getElementById("quantity").value);

    const price =
      Number(document.getElementById("unitPrice").value);

    document.getElementById("total").textContent =
      quantity * price;
  }

  loadProducts().catch(error => {

    console.error(error);

    document.getElementById("status").textContent =
      "تعذر تحميل المنتجات";
  });

  function saveSale() {

    document.getElementById("status").textContent =
      "حفظ البيع سنفعّله في الخطوة التالية...";
  }
</script>

</body>
</html>
