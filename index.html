<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>نظام المبيعات</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
    }

    h1 {
      text-align: center;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      margin-top: 20px;
      background: #222;
      color: white;
      cursor: pointer;
      border: none;
    }

    .total {
      margin-top: 20px;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🧾 فاتورة بيع</h1>

  <label>رقم الفاتورة</label>
  <input type="text" id="invoiceNumber">

  <label>اسم الزبون</label>
  <input type="text" id="customerName">

  <label>المنتج</label>
  <select id="product">
    <option value="">اختر المنتج</option>
  </select>

  <label>الكمية</label>
  <input type="number" id="quantity" value="1" min="1">

  <label>سعر الوحدة</label>
  <input type="number" id="unitPrice" readonly>

  <div class="total">
    الإجمالي: <span id="total">0</span>
  </div>

  <label>طريقة الدفع</label>
  <select id="paymentMethod">
    <option value="نقدي">نقدي</option>
    <option value="آجل">آجل</option>
  </select>

  <button onclick="saveSale()">حفظ البيع</button>

</div>

<script>
  // سنربط Supabase هنا في الخطوة القادمة

  document.getElementById("quantity").addEventListener("input", calculateTotal);

  function calculateTotal() {
    const quantity = Number(document.getElementById("quantity").value);
    const price = Number(document.getElementById("unitPrice").value);

    document.getElementById("total").textContent =
      quantity * price;
  }

  function saveSale() {
    alert("واجهة البيع جاهزة، سنربطها بقاعدة البيانات في الخطوة القادمة.");
  }
</script>

</body>
</html>
