<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام المبيعات</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
    }

    h1 {
      text-align: center;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      margin-top: 20px;
      background: #222;
      color: white;
      border: none;
    }

    .total {
      margin-top: 20px;
      padding: 15px;
      background: #f1f1f1;
      border-radius: 8px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    #status {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🧾 فاتورة بيع</h1>

  <label>رقم الفاتورة</label>
  <input type="text" id="invoiceNumber">

  <label>اسم الزبون</label>
  <input type="text" id="customerName">

  <label>المنتج</label>
  <select id="product">
    <option value="">جاري تحميل المنتجات...</option>
  </select>

  <label>الكمية</label>
  <input type="number" id="quantity" value="1" min="1">

  <label>سعر الوحدة</label>
  <input type="number" id="unitPrice" readonly>

  <div class="total">
    الإجمالي: <span id="total">0</span>
  </div>

  <label>طريقة الدفع</label>
  <select id="paymentMethod">
    <option value="نقدي">نقدي</option>
    <option value="آجل">آجل</option>
  </select>

  <button onclick="saveSale()">حفظ البيع</button>

  <div id="status"></div>
<hr style="margin-top: 30px;">

<h2 style="text-align: center;">📊 تقرير المبيعات اليومي</h2>

<label for="reportDate">اختر التاريخ</label>
<input type="date" id="reportDate">

<button type="button" onclick="loadDailyReport()">
  عرض التقرير
</button>

<div id="reportStatus" style="text-align: center; margin-top: 15px;"></div>

<div style="margin-top: 15px; padding: 15px; background: #f1f1f1; border-radius: 8px;">
  <p>عدد الفواتير: <strong id="reportCount">0</strong></p>
  <p>إجمالي المبيعات: <strong id="reportTotal">0</strong></p>
  <p>المبيعات النقدية: <strong id="reportCash">0</strong></p>
  <p>المبيعات الآجلة: <strong id="reportCredit">0</strong></p>
</div>

<div id="reportDetails" style="overflow-x: auto; margin-top: 15px;"></div>
</div>

<script>
  const SUPABASE_URL =
    "https://crihxojzewxhjpsckoew.supabase.co";

  const SUPABASE_KEY =
"sb_publishable_irCTojKFVHjkc65Y1d95zQ_xVRwQXcQ";

  let products = [];

  async function loadProducts() {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/products?select=id,name,price,quantity&order=name.asc`,
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (!response.ok) {
      throw new Error("فشل تحميل المنتجات");
    }

    products = await response.json();

    const select = document.getElementById("product");
    select.innerHTML = '<option value="">اختر المنتج</option>';

    const alerts = [];

    products.forEach(product => {
      const option = document.createElement("option");
      option.value = product.id;

      const quantity = Number(product.quantity);

      if (quantity <= 0) {
        option.textContent = `🔴 ${product.name} - نفد المخزون`;
        alerts.push(`🔴 ${product.name}: نفد المخزون`);
      } else if (quantity <= 5) {
        option.textContent =
          `⚠️ ${product.name} - ${product.price} - المتبقي: ${quantity}`;
        alerts.push(`⚠️ ${product.name}: المتبقي ${quantity} قطعة`);
      } else {
        option.textContent = `${product.name} - ${product.price}`;
      }

      select.appendChild(option);
    });

    if (alerts.length > 0) {
      alert("تنبيه المخزون\n\n" + alerts.join("\n"));
    }
  }
  document.getElementById("product")
    .addEventListener("change", function () {

      const product = products.find(
        p => String(p.id) === String(this.value)
      );

      if (product) {
        document.getElementById("unitPrice").value =
          product.price;

        calculateTotal();
      }
    });

  document.getElementById("quantity")
    .addEventListener("input", calculateTotal);

  function calculateTotal() {

    const quantity =
      Number(document.getElementById("quantity").value);

    const price =
      Number(document.getElementById("unitPrice").value);

    document.getElementById("total").textContent =
      quantity * price;
  }

  loadProducts().catch(error => {

    console.error(error);

    document.getElementById("status").textContent =
      "تعذر تحميل المنتجات";
  });

  async function saveSale() {
  const status = document.getElementById("status");

  try {
    const productId = document.getElementById("product").value;
    const quantity = Number(
      document.getElementById("quantity").value
    );
    const invoiceNumber =
      document.getElementById("invoiceNumber").value.trim();

    if (!invoiceNumber) {
      status.textContent = "أدخل رقم الفاتورة أولاً";
      return;
    }

    if (!productId) {
      status.textContent = "اختر المنتج أولاً";
      return;
    }

    const selectedProduct = products.find(
      p => String(p.id) === String(productId)
    );

    if (!selectedProduct) {
      status.textContent = "المنتج غير موجود، حدّث الصفحة";
      return;
    }

    const availableQuantity = Number(selectedProduct.quantity);

    if (availableQuantity <= 0) {
      status.textContent = "🔴 نفد مخزون هذا المنتج";
      return;
    }

    if (!Number.isInteger(quantity) || quantity < 1) {
      status.textContent = "أدخل كمية صحيحة لا تقل عن قطعة واحدة";
      return;
    }

    if (quantity > availableQuantity) {
      status.textContent =
        `⚠️ الكمية المطلوبة ${quantity}، والمتوفر فقط ${availableQuantity}`;
      return;
    }

    status.textContent = "جارٍ حفظ البيع...";

    const saleResponse = await fetch(
      `${SUPABASE_URL}/rest/v1/rpc/create_sale_with_stock`,
      {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          p_invoice_number: invoiceNumber,
          p_customer_name:
            document.getElementById("customerName").value.trim() || null,
          p_payment_method:
            document.getElementById("paymentMethod").value,
          p_product_id: Number(productId),
          p_quantity: quantity
        })
      }
    );

    const saleData = await saleResponse.json().catch(() => null);

    if (!saleResponse.ok) {
      throw new Error(
        "فشل حفظ الفاتورة (" +
        saleResponse.status +
        "): " +
        JSON.stringify(saleData)
      );
    }

    selectedProduct.quantity = Number(
      saleData.remaining_quantity
    );

    status.textContent =
      `تم حفظ البيع بنجاح ✅ المتبقي بالمخزون: ${selectedProduct.quantity}`;

  } catch (error) {
    console.error("Save sale error:", error);
    status.textContent = "خطأ في الحفظ: " + error.message;
  }
}
</script>

</body>
</html>
