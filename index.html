
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام المبيعات</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
    }

    h1, h2 { text-align: center; }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      margin-top: 20px;
      background: #222;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .total, .report-summary {
      margin-top: 20px;
      padding: 15px;
      background: #f1f1f1;
      border-radius: 8px;
    }

    .total {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    #status, #reportStatus {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    #reportDetails {
      overflow-x: auto;
      margin-top: 15px;
    }

    #reportDetails table {
      width: 100%;
      border-collapse: collapse;
    }

    #reportDetails th, #reportDetails td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: right;
      white-space: nowrap;
    }
  </style>
</head>

<body>
<div class="container">

  <h1>🧾 فاتورة بيع</h1>

  <label for="invoiceNumber">رقم الفاتورة</label>
  <input type="text" id="invoiceNumber">

  <label for="customerSelect">اختيار الزبون</label>
  <select id="customerSelect">
    <option value="">جارٍ تحميل الزبائن...</option>
  </select>

  <label for="customerName">اسم الزبون (اختياري إذا لم تختر زبونًا)</label>
  <input type="text" id="customerName" placeholder="اسم الزبون">

  <label for="product">المنتج</label>
  <select id="product">
    <option value="">جارٍ تحميل المنتجات...</option>
  </select>

  <label for="quantity">الكمية</label>
  <input type="number" id="quantity" value="1" min="1">

  <label for="unitPrice">سعر الوحدة</label>
  <input type="number" id="unitPrice" readonly>

  <div class="total">
    الإجمالي: <span id="total">0</span>
  </div>

  <label for="paymentMethod">طريقة الدفع</label>
  <select id="paymentMethod">
    <option value="نقدي">نقدي</option>
    <option value="آجل">آجل</option>
  </select>

  <button type="button" id="saveSaleButton" onclick="saveSale()">
    حفظ البيع
  </button>

  <div id="status"></div>

  <hr style="margin-top: 30px;">

  <h2>📊 تقرير المبيعات اليومي</h2>

  <label for="reportDate">اختر التاريخ</label>
  <input type="date" id="reportDate">

  <button type="button" onclick="loadDailyReport()">
    عرض التقرير
  </button>

  <div id="reportStatus"></div>

  <div class="report-summary">
    <p>عدد الفواتير: <strong id="reportCount">0</strong></p>
    <p>إجمالي المبيعات: <strong id="reportTotal">0</strong></p>
    <p>المبيعات النقدية: <strong id="reportCash">0</strong></p>
    <p>المبيعات الآجلة: <strong id="reportCredit">0</strong></p>
    <p>تكلفة البضاعة المباعة: <strong id="reportCost">0</strong></p>
    <p>الربح اليومي: <strong id="reportProfit">0</strong></p>
  </div>

  <div id="reportDetails"></div>
</div>

<script>
  const SUPABASE_URL =
    "https://crihxojzewxhjpsckoew.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_irCTojKFVHjkc65Y1d95zQ_xVRwQXcQ";

  let products = [];

  async function loadProducts() {
    const select = document.getElementById("product");
    const status = document.getElementById("status");

    select.innerHTML = '<option value="">جارٍ تحميل المنتجات...</option>';

    try {
      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/products?select=id,name,price,quantity&order=name.asc`,
        {
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${SUPABASE_KEY}`
          }
        }
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(JSON.stringify(data));
      }

      products = data;
      select.innerHTML = '<option value="">اختر المنتج</option>';

      products.forEach(product => {
        const option = document.createElement("option");
        option.value = product.id;

        const quantity = Number(product.quantity);

        option.textContent = quantity <= 0
          ? `🔴 ${product.name} - نفد المخزون`
          : quantity <= 5
            ? `⚠️ ${product.name} - ${product.price} - المتبقي: ${quantity}`
            : `${product.name} - ${product.price}`;

        select.appendChild(option);
      });

      status.textContent = products.length
        ? `تم تحميل ${products.length} منتج بنجاح ✅`
        : "جدول المنتجات فارغ.";

    } catch (error) {
      console.error("Load products:", error);
      select.innerHTML = '<option value="">فشل تحميل المنتجات</option>';
      status.textContent = "خطأ تحميل المنتجات: " + error.message;
    }
  }

  async function loadCustomers() {
    const select = document.getElementById("customerSelect");

    try {
      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/customers?select=id,name&order=name.asc`,
        {
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${SUPABASE_KEY}`
          }
        }
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(JSON.stringify(data));
      }

      select.innerHTML = '<option value="">لا يوجد زبون محدد</option>';

      data.forEach(customer => {
        const option = document.createElement("option");
        option.value = customer.id;
        option.textContent = customer.name;
        select.appendChild(option);
      });

    } catch (error) {
      console.error("Load customers:", error);
      select.innerHTML = '<option value="">تعذر تحميل الزبائن</option>';
      document.getElementById("status").textContent =
        "تعذر تحميل الزبائن: " + error.message;
    }
  }

  document.getElementById("product").addEventListener("change", function () {
    const product = products.find(
      p => String(p.id) === String(this.value)
    );

    document.getElementById("unitPrice").value =
      product ? product.price : "";

    calculateTotal();
  });

  document.getElementById("quantity")
    .addEventListener("input", calculateTotal);

  // إذا اختار المستخدم زبونًا مسجلًا، نعرض اسمه أيضًا.
  document.getElementById("customerSelect")
    .addEventListener("change", function () {
      const option = this.options[this.selectedIndex];

      if (this.value) {
        document.getElementById("customerName").value =
          option.textContent;
      }
    });

  function calculateTotal() {
    const quantity = Number(document.getElementById("quantity").value);
    const price = Number(document.getElementById("unitPrice").value);

    document.getElementById("total").textContent =
      (quantity * price).toLocaleString("en-US");
  }

  async function saveSale() {
    const status = document.getElementById("status");
    const saveButton = document.getElementById("saveSaleButton");

    if (saveButton.disabled) return;

    try {
      const productId = document.getElementById("product").value;
      const quantity = Number(document.getElementById("quantity").value);
      const invoiceNumber =
        document.getElementById("invoiceNumber").value.trim();

      const paymentMethod =
        document.getElementById("paymentMethod").value;

      const customerSelect =
        document.getElementById("customerSelect");

      const customerId = customerSelect.value
        ? Number(customerSelect.value)
        : null;

      const customerName =
        document.getElementById("customerName").value.trim();

      if (!invoiceNumber) {
        status.textContent = "أدخل رقم الفاتورة أولاً.";
        return;
      }

      if (!productId) {
        status.textContent = "اختر المنتج أولاً.";
        return;
      }

      if (paymentMethod === "آجل" && !customerId) {
        status.textContent = "اختر زبونًا مسجلًا للبيع الآجل.";
        return;
      }

      const selectedProduct = products.find(
        p => String(p.id) === String(productId)
      );

      if (!selectedProduct) {
        status.textContent = "المنتج غير موجود؛ حدّث الصفحة.";
        return;
      }

      const available = Number(selectedProduct.quantity);

      if (!Number.isInteger(quantity) || quantity < 1) {
        status.textContent = "أدخل كمية صحيحة لا تقل عن قطعة واحدة.";
        return;
      }

      if (quantity > available) {
        status.textContent =
          `الكمية المطلوبة ${quantity}، والمتوفر ${available} فقط.`;
        return;
      }

      saveButton.disabled = true;
      status.textContent = "جارٍ حفظ البيع...";

      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/rpc/create_sale_with_stock_for_customer`,
        {
          method: "POST",
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${SUPABASE_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            p_invoice_number: invoiceNumber,
            p_customer_name: customerName || null,
            p_payment_method: paymentMethod,
            p_product_id: Number(productId),
            p_quantity: quantity,
            p_customer_id: customerId
          })
        }
      );

      const result = await response.json().catch(() => null);

      if (!response.ok) {
        throw new Error(
          `فشل حفظ الفاتورة (${response.status}): ` +
          JSON.stringify(result)
        );
      }

      if (result && result.remaining_quantity !== undefined) {
        selectedProduct.quantity = Number(result.remaining_quantity);
      } else {
        await loadProducts();
      }

      status.textContent =
        `تم حفظ البيع بنجاح ✅ الإجمالي: ` +
        Number(result.total || 0).toLocaleString("en-US") +
        ` — المتبقي بالمخزون: ${selectedProduct.quantity}`;

      document.getElementById("invoiceNumber").value = "";
      document.getElementById("customerName").value = "";
      document.getElementById("customerSelect").value = "";
      document.getElementById("product").value = "";
      document.getElementById("quantity").value = 1;
      document.getElementById("unitPrice").value = "";
      document.getElementById("total").textContent = "0";

    } catch (error) {
      console.error("Save sale:", error);
      status.textContent = "خطأ في الحفظ: " + error.message;
    } finally {
      saveButton.disabled = false;
    }
  }

  async function loadDailyReport() {
    const reportStatus = document.getElementById("reportStatus");
    const reportDate = document.getElementById("reportDate").value;
    const detailsContainer = document.getElementById("reportDetails");

    if (!reportDate) {
      reportStatus.textContent = "اختر التاريخ أولاً.";
      return;
    }

    reportStatus.textContent = "جارٍ تحميل التقرير...";
    detailsContainer.innerHTML = "";

    try {
      const start = new Date(reportDate + "T00:00:00+03:00");
      const end = new Date(start.getTime() + 24 * 60 * 60 * 1000);

      const url =
        `${SUPABASE_URL}/rest/v1/sales` +
        `?select=id,created_at,invoice_number,customer_name,total_amount,payment_method` +
        `&created_at=gte.${encodeURIComponent(start.toISOString())}` +
        `&created_at=lt.${encodeURIComponent(end.toISOString())}` +
        `&order=created_at.desc`;

      const response = await fetch(url, {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`
        }
      });

      const sales = await response.json();

      if (!response.ok) {
        throw new Error("خطأ قراءة المبيعات: " + JSON.stringify(sales));
      }

      if (!Array.isArray(sales)) {
        throw new Error("بيانات المبيعات غير صحيحة.");
      }

      let cost = 0;
      let profit = 0;

      if (sales.length > 0) {
        const ids = sales.map(sale => sale.id).join(",");

        const detailsResponse = await fetch(
          `${SUPABASE_URL}/rest/v1/sale_details` +
          `?select=sale_id,quantity,unit_price,unit_cost` +
          `&sale_id=in.(${ids})`,
          {
            headers: {
              apikey: SUPABASE_KEY,
              Authorization: `Bearer ${SUPABASE_KEY}`
            }
          }
        );

        const items = await detailsResponse.json();

        if (!detailsResponse.ok) {
          throw new Error(
            "خطأ قراءة تفاصيل المبيعات: " + JSON.stringify(items)
          );
        }

        cost = items.reduce(
          (sum, item) =>
            sum + Number(item.unit_cost || 0) * Number(item.quantity || 0),
          0
        );

        profit = items.reduce(
          (sum, item) =>
            sum + (
              Number(item.unit_price || 0) -
              Number(item.unit_cost || 0)
            ) * Number(item.quantity || 0),
          0
        );
      }

      const total = sales.reduce(
        (sum, sale) => sum + Number(sale.total_amount || 0), 0
      );

      const cash = sales
        .filter(sale => sale.payment_method === "نقدي")
        .reduce((sum, sale) => sum + Number(sale.total_amount || 0), 0);

      const credit = sales
        .filter(sale => sale.payment_method === "آجل")
        .reduce((sum, sale) => sum + Number(sale.total_amount || 0), 0);

      document.getElementById("reportCount").textContent = sales.length;
      document.getElementById("reportTotal").textContent = total.toLocaleString("en-US");
      document.getElementById("reportCash").textContent = cash.toLocaleString("en-US");
      document.getElementById("reportCredit").textContent = credit.toLocaleString("en-US");
      document.getElementById("reportCost").textContent = cost.toLocaleString("en-US");
      document.getElementById("reportProfit").textContent = profit.toLocaleString("en-US");

      if (sales.length === 0) {
        detailsContainer.textContent = "ماكو مبيعات بهذا التاريخ.";
      } else {
        const table = document.createElement("table");
        const thead = document.createElement("thead");
        const header = document.createElement("tr");

        [
          "رقم الفاتورة", "الزبون", "المبلغ", "الدفع", "الوقت"
        ].forEach(label => {
          const th = document.createElement("th");
          th.textContent = label;
          header.appendChild(th);
        });

        thead.appendChild(header);
        table.appendChild(thead);

        const tbody = document.createElement("tbody");

        sales.forEach(sale => {
          const row = document.createElement("tr");

          const values = [
            sale.invoice_number || "",
            sale.customer_name || "بدون اسم",
            Number(sale.total_amount || 0).toLocaleString("en-US"),
            sale.payment_method || "",
            new Date(sale.created_at).toLocaleTimeString("en-GB", {
              timeZone: "Asia/Baghdad",
              hour: "2-digit",
              minute: "2-digit"
            })
          ];

          values.forEach(value => {
            const td = document.createElement("td");
            td.textContent = value;
            row.appendChild(td);
          });

          tbody.appendChild(row);
        });

        table.appendChild(tbody);
        detailsContainer.replaceChildren(table);
      }

      reportStatus.textContent = "تم تحميل التقرير بنجاح ✅";

    } catch (error) {
      console.error("Daily report:", error);
      reportStatus.textContent = "تعذر تحميل التقرير: " + error.message;
    }
  }

  document.getElementById("reportDate").value =
    new Date().toLocaleDateString("en-CA", {
      timeZone: "Asia/Baghdad"
    });

  loadProducts();
  loadCustomers();
  
  // تحميل الزبائن في قائمة تسديد الديون
  async function loadPaymentCustomers() {
    const select = document.getElementById("paymentCustomer");
    const status = document.getElementById("paymentStatus");

    try {
      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/customers?select=id,name&order=name.asc`,
        {
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${SUPABASE_KEY}`
          }
        }
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(JSON.stringify(data));
      }

      select.innerHTML = '<option value="">اختر الزبون</option>';

      data.forEach(customer => {
        const option = document.createElement("option");
        option.value = customer.id;
        option.textContent = customer.name;
        select.appendChild(option);
      });

    } catch (error) {
      console.error("Load payment customers:", error);
      select.innerHTML = '<option value="">تعذر تحميل الزبائن</option>';
      status.textContent = "خطأ تحميل الزبائن: " + error.message;
    }
  }

  // تسجيل دفعة لتسديد دين زبون
  async function saveCustomerPayment() {
    const select = document.getElementById("paymentCustomer");
    const amountInput = document.getElementById("paymentAmount");
    const status = document.getElementById("paymentStatus");
    const button = document.querySelector(
      'button[onclick="saveCustomerPayment()"]'
    );

    if (button.disabled) return;

    const customerId = select.value;
    const amount = Number(amountInput.value);

    if (!customerId) {
      status.textContent = "يرجى اختيار الزبون أولاً.";
      return;
    }

    if (!Number.isFinite(amount) || amount <= 0) {
      status.textContent = "أدخل مبلغ دفعة صحيحًا أكبر من صفر.";
      return;
    }

    button.disabled = true;
    status.textContent = "جارٍ تسجيل الدفعة...";

    try {
      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/rpc/record_customer_payment`,
        {
          method: "POST",
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${SUPABASE_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            p_customer_id: Number(customerId),
            p_amount: amount
          })
        }
      );

      const result = await response.json().catch(() => null);

      if (!response.ok) {
        throw new Error(
          `خطأ (${response.status}): ${JSON.stringify(result)}`
        );
      }

      status.textContent =
        "تم تسجيل الدفعة بنجاح ✅ المبلغ: " +
        amount.toLocaleString("en-US");

      amountInput.value = "";

    } catch (error) {
      console.error("Save customer payment:", error);
      status.textContent = "تعذر تسجيل الدفعة: " + error.message;
    } finally {
      button.disabled = false;
    }
  }

  loadPaymentCustomers();

</script>
  
<hr>
<h2>💰 تسديد ديون الزبائن</h2>

<div class="container">
  <label for="paymentCustomer">اختر الزبون:</label>
  <select id="paymentCustomer" style="width:100%;padding:10px;margin:8px 0;">
    <option value="">جارٍ تحميل الزبائن...</option>
  </select>

  <label for="paymentAmount">مبلغ الدفعة:</label>
  <input
    id="paymentAmount"
    type="number"
    min="1"
    step="0.01"
    placeholder="أدخل مبلغ الدفعة"
    style="width:100%;padding:10px;margin:8px 0;box-sizing:border-box;"
  >

  <button type="button" onclick="saveCustomerPayment()">
    تسجيل الدفعة
  </button>

  <p id="paymentStatus"></p>
</div>

</body>
</html>
